<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111114">
  <meta name="description" content="QDAY mainnet block explorer for blocks, transactions, addresses and network status.">
  <title>QDAY Explorer</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=15">
</head>
<body>
  <header class="site-header">
    <a class="brand route-link" href="/" aria-label="QDAY Explorer home">
      <img src="/assets/logo.webp" alt="QDAY">
      <span></span>
      <strong>EXPLORER</strong>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a class="route-link" data-nav="overview" href="/">Overview</a>
      <a class="route-link" data-nav="blocks" href="/blocks">Blocks</a>
      <a class="route-link" data-nav="transactions" href="/transactions"><span class="nav-long">Transactions</span><span class="nav-short">TXS</span></a>
      <a class="route-link premine-nav" data-nav="premine" href="/premine">Premine</a>
      <a class="route-link" data-nav="qday" href="/qday"><span class="nav-long">PQ Day status</span><span class="nav-short">PQ Day</span></a>
      <a class="route-link" data-nav="rich-list" href="/rich-list"><span class="nav-long">Rich list</span><span class="nav-short">Rich</span></a>
    </nav>
    <nav class="external-nav" aria-label="Project links">
      <a href="https://pqday.com" target="_blank" rel="noreferrer">Website ↗</a>
      <a href="https://github.com/petoshi/qday" target="_blank" rel="noreferrer">Code ↗</a>
    </nav>
    <div class="live-pill"><i></i><span id="network-pill">MAINNET</span></div>
  </header>

  <main id="app" aria-live="polite">
    <section class="loading-page"><div class="loader"></div><p>Loading explorer data…</p></section>
  </main>

  <footer>
    <div class="footer-brand"><img src="/assets/logo.webp" alt="QDAY"><span>MAINNET EXPLORER</span></div>
    <div class="footer-links">
      <a href="https://pqday.com" target="_blank" rel="noreferrer">Website</a>
      <a href="https://github.com/petoshi/qday/releases/latest" target="_blank" rel="noreferrer">Downloads</a>
      <a href="https://github.com/petoshi/qday" target="_blank" rel="noreferrer">Node source</a>
      <a href="https://x.com/_petoshi" target="_blank" rel="noreferrer">petoshi</a>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=15" defer></script>
</body>
</html>
